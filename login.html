<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Resume Shield</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="auth-page">

  <div class="main-wrapper">
    <nav class="side-nav">
      <div class="nav-logo">
        <i class="fas fa-shield-alt"></i> RESUME SHIELD
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="#solution">Solution</a></li>
        <li><a href="#pricing">Pricing</a></li>
        <li><a href="#demo">Demo</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
      <div class="nav-footer">
        <button class="btn-red-pill" onclick="window.location.href='signup.html'">TRY FOR FREE</button>
      </div>
    </nav>

    <div class="auth-content">
      <div class="auth-card">
        <h2>Login</h2>
        <p class="subtitle">Access your Authority Dashboard</p>

        <div class="input-group">
          <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="email@example.com">
          </div>
          <div class="field">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••">
          </div>
        </div>

        <button class="btn-red-wide" onclick="login()">SIGN IN</button>

        <div class="social-divider"><span>OR</span></div>

        <div class="social-logins">
          <button class="social-btn"><img src="https://img.icons8.com/color/16/000000/google-logo.png"/> Sign in with Google</button>
          <button class="social-btn"><i class="fab fa-github"></i> Sign in with GitHub</button>
        </div>

        <p class="auth-footer">Don't have an account? <a href="signup.html">Go to Signup</a></p>
      </div>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          localStorage.setItem("token", data.token);
          // Redirect to the dashboard file
          window.location.href = "dashboard.html";
        } else {
          alert(data.message || "Login failed");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Server error. Please try again later.");
      }
    }
  </script>
</body>
</html>
